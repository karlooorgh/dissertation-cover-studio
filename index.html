<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'unsafe-inline' blob:; connect-src 'self'; img-src data: blob:; font-src data: blob:; frame-src 'self' blob:; object-src blob:; base-uri about:; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Cover studio</title>
  <link rel="icon" href="data:,">
  <style>
    :root{color-scheme:light;--paper:#f7f6f2;--ground:#e4e6df;--ink:#202820;--muted:#647060;--line:#cbd1c6;--green:#2d4b39}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.5 Arial,sans-serif;color:var(--ink);background:var(--ground)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #84a77b;outline-offset:3px}[hidden]{display:none!important}
    .gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 20px}.card{width:min(100%,420px);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:34px;box-shadow:0 8px 32px #2533260b}.mark{width:43px;height:43px;border:1px solid #75806f;display:grid;place-items:center;font:29px Georgia,serif;margin-bottom:26px}.eyebrow{margin:0 0 7px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}h1{font:32px/1.2 Georgia,serif;letter-spacing:-.5px;margin:0 0 12px}.intro{color:var(--muted);margin:0 0 27px;font-size:13px}.password-label{display:block;font-weight:600;font-size:12px;margin:0 0 8px}.password-row{display:flex;align-items:stretch;border:1px solid #b9c3b4;background:#fff;border-radius:4px}.password-row:focus-within{border-color:var(--green)}.password-row input{width:100%;min-width:0;border:0;background:transparent;padding:12px;color:var(--ink);border-radius:4px}.password-row button{border:0;border-left:1px solid var(--line);background:transparent;padding:0 13px;color:var(--green);font-size:12px;min-width:58px}.unlock{margin-top:15px;border:1px solid var(--green);border-radius:4px;width:100%;padding:12px 16px;background:var(--green);color:#fff;font-weight:600}.unlock:hover{background:#203b2b}button:disabled{cursor:default;opacity:.55}.status{min-height:40px;margin:13px 0 0;font-size:12px;color:var(--muted)}.status[data-error=true]{color:#8b3d25}.footnote{border-top:1px solid var(--line);padding-top:18px;margin:15px 0 0;font-size:11px;color:var(--muted)}
    .workspace{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.toolbar{display:flex;align-items:center;gap:14px;flex:0 0 auto;min-height:49px;padding:8px 17px;background:var(--paper);border-bottom:1px solid var(--line)}.toolbar strong{font-size:13px;font-weight:600;white-space:nowrap}.toolbar .nav-status{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toolbar button{background:transparent;color:var(--ink);border:1px solid #bfc8b9;border-radius:4px;padding:6px 10px;font-size:12px;white-space:nowrap}.toolbar button:hover{background:#e9eee3}.frame-host{flex:1;min-height:0}.frame-host iframe{display:block;border:0;width:100%;height:100%;background:var(--ground)}
    @media(max-width:480px){.card{padding:26px}.toolbar{gap:8px;padding:8px 11px}.toolbar .nav-status{font-size:11px}.toolbar strong{font-size:12px}.toolbar button{padding:6px 8px}}
  </style>
  <script src="./gate.js" defer></script>
</head>
<body>
  <main id="gate" class="gate">
    <section class="card" aria-labelledby="gate-title">
      <div class="mark" aria-hidden="true">C</div>
      <p class="eyebrow">Private workspace</p>
      <h1 id="gate-title">Cover studio</h1>
      <p class="intro">Enter the password to open this workspace.</p>
      <form id="unlock-form" method="post">
        <label class="password-label" for="workspace-password">Password</label>
        <div class="password-row">
          <input id="workspace-password" name="password" type="password" required autocomplete="current-password" spellcheck="false" autocapitalize="none" aria-describedby="gate-status">
          <button type="button" id="show-password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <button id="unlock-button" class="unlock" type="submit">Unlock workspace</button>
        <p id="gate-status" class="status" role="status" aria-live="polite"></p>
      </form>
      <p class="footnote">Files are decrypted in this browser. Lock the workspace when you are finished.</p>
      <noscript><p>This workspace needs JavaScript to decrypt and open its files.</p></noscript>
    </section>
  </main>
  <section id="workspace" class="workspace" aria-label="Unlocked workspace" hidden>
    <header class="toolbar">
      <strong>Cover editor</strong>
      <span id="navigation-status" class="nav-status" role="status" aria-live="polite"></span>
      <button type="button" id="back-to-editor" hidden>Back to editor</button>
      <button type="button" id="lock-workspace">Lock</button>
    </header>
    <div id="frame-host" class="frame-host"></div>
  </section>
</body>
</html>
